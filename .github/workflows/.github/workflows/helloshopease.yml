on:
  push:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from ShopEase CI!"

      - name: Who and where am I?
        run: |
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "Commit      : $GITHUB_SHA"
